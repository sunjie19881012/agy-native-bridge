<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex 会话</title>
<script id="theme-startup">
  try {
    const savedTheme = window.localStorage.getItem('agy-native-bridge.theme');
    if (savedTheme === 'dark' || savedTheme === 'light') document.documentElement.dataset.theme = savedTheme;
    else delete document.documentElement.dataset.theme;
  } catch { /* the system preference works without storage */ }
</script>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22none%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22nbBridgeGrad%22%20x1%3D%223%22%20y1%3D%2220%22%20x2%3D%2221%22%20y2%3D%224%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%232dd4bf%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%2360a5fa%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Cpath%20d%3D%22M17%2011v3.5a2.5%202.5%200%200%201-2.5%202.5H11%22%20stroke%3D%22%2364748b%22%20stroke-width%3D%221.8%22%20stroke-linecap%3D%22round%22%20stroke-dasharray%3D%221.5%202.5%22%2F%3E%3Cpath%20d%3D%22M7%2013V9.5A2.5%202.5%200%200%201%209.5%207H13%22%20stroke%3D%22url(%23nbBridgeGrad)%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%2F%3E%3Crect%20x%3D%2213%22%20y%3D%223%22%20width%3D%228%22%20height%3D%228%22%20rx%3D%222.2%22%20stroke%3D%22url(%23nbBridgeGrad)%22%20stroke-width%3D%222%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%2213%22%20width%3D%228%22%20height%3D%228%22%20rx%3D%222.2%22%20fill%3D%22url(%23nbBridgeGrad)%22%2F%3E%3C%2Fsvg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6f9; --surface: #ffffff; --surface-hover: #f8fafc; --surface-subtle: #eef2f6;
    --border: #e2e8f0; --border-strong: #cbd5e1; --text: #0f172a; --muted: #475569; --faint: #64748b;
    --accent: #0d9488; --accent-soft: rgba(13, 148, 136, 0.10); --accent-border: rgba(13, 148, 136, 0.34);
    --sky: #2563eb; --attention: #b45309; --attention-soft: rgba(245, 158, 11, 0.14);
    --success: #15803d; --success-soft: rgba(34, 197, 94, 0.12);
    --failure: #dc2626; --failure-soft: rgba(239, 68, 68, 0.11); --shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    --radius: 10px; --radius-sm: 7px;
    font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    font-size: 12.5px; line-height: 1.45;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f1117; --surface: #161922; --surface-hover: #1b1f2b; --surface-subtle: #12151d;
      --border: rgba(255, 255, 255, 0.08); --border-strong: rgba(255, 255, 255, 0.14);
      --text: #eceff4; --muted: #94a0b8; --faint: #677389;
      --accent: #2dd4bf; --accent-soft: rgba(45, 212, 191, 0.14); --accent-border: rgba(45, 212, 191, 0.36);
      --sky: #60a5fa; --attention: #f59e0b; --attention-soft: rgba(245, 158, 11, 0.15);
      --success: #34d399; --success-soft: rgba(52, 211, 153, 0.14);
      --failure: #f87171; --failure-soft: rgba(248, 113, 113, 0.14); --shadow: 0 1px 3px rgba(0, 0, 0, 0.28);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1117; --surface: #161922; --surface-hover: #1b1f2b; --surface-subtle: #12151d;
    --border: rgba(255, 255, 255, 0.08); --border-strong: rgba(255, 255, 255, 0.14);
    --text: #eceff4; --muted: #94a0b8; --faint: #677389;
    --accent: #2dd4bf; --accent-soft: rgba(45, 212, 191, 0.14); --accent-border: rgba(45, 212, 191, 0.36);
    --sky: #60a5fa; --attention: #f59e0b; --attention-soft: rgba(245, 158, 11, 0.15);
    --success: #34d399; --success-soft: rgba(52, 211, 153, 0.14);
    --failure: #f87171; --failure-soft: rgba(248, 113, 113, 0.14); --shadow: 0 1px 3px rgba(0, 0, 0, 0.28);
  }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  main { max-width: 680px; margin: 0 auto; padding: 12px; }
  p, h1, h2, h3 { margin: 0; }
  .muted { color: var(--muted); }
  .top-row, .brand, .usage, .sync-status, .toolbar, .toolbar-main, .group-head, .card-head,
  .card-heading, .card-meta, .actions, .actions-main, .actions-end { display: flex; align-items: center; }
  .top-row, .toolbar, .group-head, .card-head, .actions { justify-content: space-between; }
  .top-row { gap: 6px; }
  .brand { min-width: 0; gap: 6px; flex-wrap: wrap; }
  .brand-logo { display: grid; place-items: center; flex: 0 0 22px; width: 22px; height: 22px;
    background: var(--accent-soft); border: 1px solid var(--accent-border); border-radius: 6px; }
  .brand h1 { font-size: 14px; font-weight: 650; white-space: nowrap; }
  .sync-status { gap: 4px; white-space: nowrap; font-size: 10px; color: var(--muted); }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
  .sync-status.is-paused .sync-dot, .sync-status.is-pending .sync-dot { background: var(--faint); }
  .usage { flex: none; gap: 4px; }
  .quota-pill { min-width: 44px; padding: 3px 4px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--surface); font-size: 10px; }
  .quota-values { display: flex; justify-content: space-between; gap: 3px; color: var(--muted); line-height: 1.25; }
  .quota-values strong { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
  .quota-track { height: 2.5px; margin-top: 3px; border-radius: 2px; background: var(--surface-subtle); overflow: hidden; }
  .quota-fill { display: block; height: 100%; width: var(--fill, 0%); background: linear-gradient(90deg, var(--accent), var(--sky)); }
  .tool-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .search-bar { display: flex; flex: 1 1 148px; align-items: center; gap: 5px; min-width: 0; padding: 0 6px;
    border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--faint); }
  .search-bar:focus-within { border-color: var(--accent-border); }
  .search-bar svg, button svg { width: 14px; height: 14px; flex: none; }
  .search-bar input { flex: 1; min-width: 0; height: 26px; padding: 0; font: inherit; color: var(--text);
    background: transparent; border: 0; }
  .search-bar input:focus { outline: none; }
  .search-bar input::-webkit-search-cancel-button { display: none; }
  .toolbar, .toolbar-main { gap: 4px; flex-wrap: wrap; }
  .toolbar { flex: 1 1 auto; min-width: 0; }
  button { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-height: 25px; padding: 2px 6px;
    font: inherit; font-size: 11px; cursor: pointer; white-space: nowrap; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-sm); }
  button:hover { background: var(--surface-hover); border-color: var(--border-strong); }
  button[aria-pressed="true"], button[aria-expanded="true"] { color: var(--accent); border-color: var(--accent-border); }
  button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { cursor: wait; opacity: .65; }
  .primary { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); font-weight: 650; }
  .primary:hover { background: var(--accent-soft); border-color: var(--accent); }
  .icon-button { width: 25px; padding: 0; }
  .clear-search { min-height: 20px; color: var(--muted); padding: 0 3px; border-color: transparent; }
  .outside-approvals { justify-content: flex-start; width: 100%; margin-top: 7px; color: var(--attention);
    background: var(--attention-soft); border-color: rgba(245, 158, 11, 0.45); }
  .outside-approvals:hover { background: var(--attention-soft); border-color: var(--attention); }
  .group { margin-top: 11px; }
  .group-head { gap: 6px; padding: 0 1px 4px; color: var(--faint); }
  .group-head h2 { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
  .count { font: 11px Consolas, "Cascadia Code", monospace; }
  .card { min-width: 0; padding: 8px; margin-top: 5px; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); box-shadow: var(--shadow); }
  .card.current-pair { border-color: var(--accent-border); box-shadow: inset 3px 0 0 var(--accent), var(--shadow); }
  .card.attention { border-color: rgba(245, 158, 11, 0.45); box-shadow: inset 3px 0 0 var(--attention), var(--shadow); }
  .card-head { align-items: flex-start; gap: 6px; }
  .card-heading { align-items: flex-start; gap: 6px; min-width: 0; }
  .card-heading h3 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
    overflow-wrap: anywhere; font-size: 12.5px; font-weight: 650; }
  .status-dot { flex: 0 0 7px; width: 7px; height: 7px; margin-top: 5px; border-radius: 50%; background: var(--faint); }
  .status-dot.active { background: var(--accent); animation: status-pulse 2s ease-in-out infinite; }
  .status-dot.waiting_approval { background: var(--attention); box-shadow: 0 0 0 3px var(--attention-soft); }
  .status-dot.completed { background: var(--success); }
  .status-dot.failed { background: var(--failure); }
  @keyframes status-pulse { 50% { opacity: .55; box-shadow: 0 0 0 4px var(--accent-soft); } }
  @media (prefers-reduced-motion: reduce) { .status-dot.active { animation: none; } }
  .badge, .pair-badge { border-radius: 10px; padding: 2px 5px; background: var(--surface-subtle); color: var(--muted);
    font-size: 10px; font-weight: 650; }
  .badge { flex: none; white-space: nowrap; }
  .badge.active, .pair-badge.current { color: var(--accent); background: var(--accent-soft); }
  .badge.waiting_approval { color: var(--attention); background: var(--attention-soft); }
  .badge.completed { color: var(--success); background: var(--success-soft); }
  .badge.failed { color: var(--failure); background: var(--failure-soft); }
  .card-meta { min-width: 0; margin-top: 4px; gap: 5px; }
  .pair-badge, .workspace { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pair-badge { flex-shrink: 1; max-width: 62%; }
  .workspace { flex: 1; color: var(--faint); font: 10.5px Consolas, "Cascadia Code", monospace; }
  .actions { align-items: flex-start; gap: 5px; margin-top: 7px; }
  .actions-main { min-width: 0; gap: 4px; flex-wrap: wrap; }
  .actions-end { flex: none; gap: 3px; }
  .actions-end button { font-size: 14px; color: var(--muted); }
  .actions-end .star-button[aria-pressed="true"] { color: #f59e0b; }
  .auto-read-controls { display: inline-flex; align-items: center; gap: 3px; }
  .auto-read-limit, .pair-label input { padding: 3px 4px; font: inherit; font-size: 11px; color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-subtle); }
  .auto-read-limit { width: 38px; }
  .auto-read-error { margin-top: 6px; color: var(--failure); font-size: 11px; }
  .more-panel { display: grid; gap: 5px; margin-top: 7px; padding-top: 6px; border-top: 1px dashed var(--border); }
  .pair-label, .pair-actions { display: flex; gap: 4px; }
  .pair-label input { flex: 1; min-width: 0; }
  .pair-actions { flex-wrap: wrap; }
  .summary { display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; padding: 7px 0 0;
    border-top: 1px solid var(--border); margin-top: 7px; }
  .summary-role { font-size: 11px; color: var(--muted); font-weight: 650; }
  .message { min-width: 0; overflow-wrap: anywhere; max-height: 210px; overflow-y: auto;
    padding-inline-start: 7px; border-inline-start: 2px solid var(--accent-border); }
  .message > :first-child { margin-top: 0; }
  .message > :last-child { margin-bottom: 0; }
  .message p, .message ul, .message ol, .message blockquote, .message pre, .md-table { margin: 6px 0; }
  .message h1, .message h2, .message h3, .message h4 { margin: 8px 0 4px; font-size: 1em; }
  .message h1, .message h2 { font-size: 1.1em; }
  .message ul, .message ol { padding-inline-start: 17px; }
  .message blockquote { padding-inline-start: 7px; border-inline-start: 2px solid var(--border-strong); color: var(--muted); }
  .message hr { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }
  .message code { font: .92em Consolas, "Cascadia Code", monospace; background: var(--surface-subtle);
    border-radius: 3px; padding: 1px 3px; }
  .message pre { overflow-x: auto; max-width: 100%; padding: 6px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--surface-subtle); }
  .message pre code { white-space: pre; padding: 0; }
  .message a { color: var(--sky); text-decoration: underline; }
  .md-table { overflow-x: auto; max-width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .md-table table { border-collapse: collapse; }
  .md-table th, .md-table td { padding: 4px 6px; border: 1px solid var(--border); text-align: start; }
  .md-table th { background: var(--surface-subtle); }
  .session-drawer { margin-top: 6px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-subtle); }
  .session-drawer summary { padding: 5px 7px; color: var(--muted); cursor: pointer; }
  .session-drawer .card { margin: 0 5px 5px; }
  .empty { padding: 6px 0; color: var(--muted); }
  .empty-scope { display: grid; justify-items: start; gap: 4px; margin-top: 9px; }
  #feedback { font-size: 11px; }
  #feedback:not(:empty) { margin-top: 4px; }
  @media (max-width: 300px) {
    main { padding: 10px; }
    .brand { gap: 4px; }
    .card { padding: 7px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="top-row">
      <div class="brand">
        <span class="brand-logo">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false" fill="none">
            <defs>
              <linearGradient id="nbBridgeHeaderGrad" x1="3" y1="20" x2="21" y2="4" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#2dd4bf"/>
                <stop offset="100%" stop-color="#60a5fa"/>
              </linearGradient>
            </defs>
            <path d="M17 11v3.5a2.5 2.5 0 0 1-2.5 2.5H11" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.5 2.5"/>
            <path d="M7 13V9.5A2.5 2.5 0 0 1 9.5 7H13" stroke="url(#nbBridgeHeaderGrad)" stroke-width="2" stroke-linecap="round"/>
            <rect x="13" y="3" width="8" height="8" rx="2.2" stroke="url(#nbBridgeHeaderGrad)" stroke-width="2"/>
            <rect x="3" y="13" width="8" height="8" rx="2.2" fill="url(#nbBridgeHeaderGrad)"/>
          </svg>
        </span>
        <h1>Codex 会话</h1>
        <span id="sync-status" class="sync-status is-pending"><span class="sync-dot" aria-hidden="true"></span><span id="synced">待同步</span></span>
      </div>
      <div class="usage" id="usage" aria-label="Codex 剩余额度"></div>
    </div>
    <div class="tool-row">
      <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
        <input id="search" type="search" placeholder="搜索标题 / 工作区 / ID…" autocomplete="off" aria-label="模糊搜索会话">
        <button id="clear-search" class="clear-search" type="button" title="清空搜索" hidden>清空</button>
      </div>
      <div class="toolbar">
        <div class="toolbar-main">
          <button id="refresh" type="button" class="primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 10a7 7 0 0 0-12-4L4 9m0-5v5h5m-4 5a7 7 0 0 0 12 4l3-3m0 5v-5h-5"/></svg>刷新</button>
          <button id="pause" type="button" aria-pressed="false">暂停心跳</button>
          <button id="notifications" type="button" class="icon-button" title="桌面通知" aria-label="桌面通知" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 10a6 6 0 0 1 12 0v4l1.5 2H4.5L6 14zm4 9a2 2 0 0 0 4 0"/></svg></button>
          <button id="theme-toggle" type="button" class="icon-button" title="跟随系统主题" aria-label="跟随系统主题"></button>
        </div>
        <button id="current-only" type="button" aria-pressed="false">仅看当前对话</button>
      </div>
    </div>
  </header>
  <button id="outside-approvals" class="outside-approvals" type="button" hidden></button>
  <p id="feedback" class="muted" aria-live="polite"></p>
  <div id="targets"></div>
</main>
<script>
  const targets = ['101-codex', 'win-codex', '101-dsh', 'win-dsh'];
  const labels = {
    waiting_approval: '等待原窗口审批', active: '运行中', completed: '已完成', failed: '失败',
    idle: '空闲', unloaded: '未加载', offline: '离线', paused: '暂停', unknown: '待确认', interrupted: '已中断'
  };
  const byId = id => document.getElementById(id);
  const token = new URLSearchParams(location.search).get('token') || window.sidecar?.token || '';
  const summaries = new Map();
  const drawers = new Set();
  const scopeOverrides = new Map();
  const systemTheme = window.matchMedia?.('(prefers-color-scheme: dark)');
  const themeCacheKey = 'agy-native-bridge.theme';
  let state;
  let renderedSnapshot;
  let focusInFlight;
  let lastFeedback;
  let searchQuery = '';
  let theme = 'auto';
  let pendingTheme;

  function currentConversation() {
    return window.sidecar?.conversationId ?? new URLSearchParams(location.search).get('conversationId') ?? '';
  }

  function normalizeTheme(value) {
    return value === 'dark' || value === 'light' ? value : 'auto';
  }

  function nextTheme(mode) {
    if (mode === 'auto') return systemTheme?.matches ? 'light' : 'dark';
    return mode === 'dark' ? 'light' : 'auto';
  }

  function applyTheme(mode) {
    theme = normalizeTheme(mode);
    const root = document.documentElement;
    if (theme === 'auto') delete root.dataset.theme;
    else root.dataset.theme = theme;

    const themeName = { auto: '跟随系统主题', dark: '深色主题', light: '浅色主题' };
    const nextAction = { auto: '跟随系统', dark: '切换深色', light: '切换浅色' };
    const label = themeName[theme] + '（点击' + nextAction[nextTheme(theme)] + '）';
    const toggle = byId('theme-toggle');
    toggle.title = label;
    toggle.setAttribute('aria-label', label);

    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    const attributes = { width: '14', height: '14', viewBox: '0 0 24 24', fill: 'none',
      stroke: 'currentColor', 'stroke-width': '1.8', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' };
    for (const [name, value] of Object.entries(attributes)) svg.setAttribute(name, value);
    if (theme !== 'dark') {
      const circle = document.createElementNS(ns, 'circle');
      circle.setAttribute('cx', '12');
      circle.setAttribute('cy', '12');
      circle.setAttribute('r', theme === 'light' ? '4' : '8.5');
      svg.append(circle);
    }
    const path = document.createElementNS(ns, 'path');
    const drawings = {
      auto: 'M12 3.5a8.5 8.5 0 0 1 0 17z',
      dark: 'M20.7 14.4A8.8 8.8 0 0 1 9.6 3.3 8.8 8.8 0 1 0 20.7 14.4Z',
      light: 'M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2 1.4 1.4M5 19l1.4-1.4M17.6 6.4 19 5'
    };
    path.setAttribute('d', drawings[theme]);
    if (theme === 'auto') path.setAttribute('fill', 'currentColor');
    svg.append(path);
    toggle.replaceChildren(svg);
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function appendMarkdownInline(parent, text) {
    const tokens = /(`[^`\n]+`)|\[([^\]\n]+)\]\(((?:[^\s()]|\([^\s()]*\))+)\)|\*\*([^*\n]+)\*\*|\*([^*\n]+)\*|<[^>\n]*>/g;
    let start = 0;
    for (const match of text.matchAll(tokens)) {
      if (match.index > start) parent.append(el('span', '', text.slice(start, match.index)));
      const [raw, code, label, link, strong, emphasis] = match;
      if (code) parent.append(el('code', '', code.slice(1, -1)));
      else if (link) {
        let url;
        try { url = new URL(link); } catch { /* use literal text */ }
        if (url && ['http:', 'https:'].includes(url.protocol)) {
          const anchor = el('a', '', label);
          anchor.href = url.href;
          anchor.target = '_blank';
          anchor.rel = 'noopener noreferrer';
          parent.append(anchor);
        } else parent.append(el('span', '', raw));
      } else if (strong) parent.append(el('strong', '', strong));
      else if (emphasis) parent.append(el('em', '', emphasis));
      else parent.append(el('span', '', raw));
      start = match.index + raw.length;
    }
    if (start < text.length) parent.append(el('span', '', text.slice(start)));
  }

  function renderMarkdown(text) {
    const content = el('div', 'message');
    const lines = text.replace(/\r\n?/g, '\n').split('\n');
    const heading = /^(#{1,4})\s+(.+)$/;
    const fence = /^(`{3,})[\w+.#-]*\s*$/;
    const list = /^([-*]|\d+\.)\s+(.+)$/;
    const rule = /^-{3,}$/;
    const cells = line => line.replace(/^\||\|$/g, '').split('|').map(cell => cell.trim());
    const tableAt = i => lines[i]?.trim().includes('|') && lines[i + 1]?.trim().includes('|')
      && cells(lines[i + 1].trim()).length === cells(lines[i].trim()).length
      && cells(lines[i + 1].trim()).every(cell => /^:?-{3,}:?$/.test(cell));
    const inline = (tag, value) => {
      const node = el(tag);
      appendMarkdownInline(node, value);
      return node;
    };
    let i = 0;
    while (i < lines.length) {
      const line = lines[i].trim();
      if (!line) { i++; continue; }
      const mark = line.match(fence);
      const title = line.match(heading);
      const item = line.match(list);
      if (mark) {
        const code = [];
        i++;
        while (i < lines.length) {
          const closer = lines[i].trim();
          if (/^`{3,}$/.test(closer) && closer.length >= mark[1].length) break;
          code.push(lines[i++]);
        }
        if (i < lines.length) i++;
        const pre = el('pre');
        pre.append(el('code', '', code.join('\n')));
        content.append(pre);
      } else if (title) {
        content.append(inline('h' + title[1].length, title[2]));
        i++;
      } else if (rule.test(line)) {
        content.append(el('hr'));
        i++;
      } else if (line.startsWith('> ')) {
        const quote = [];
        while (i < lines.length && lines[i].trim().startsWith('> ')) quote.push(lines[i++].trim().slice(2));
        content.append(inline('blockquote', quote.join(' ')));
      } else if (item) {
        const ordered = /^\d/.test(item[1]);
        const node = el(ordered ? 'ol' : 'ul');
        if (ordered) {
          const start = Number.parseInt(item[1], 10);
          if (Number.isSafeInteger(start) && start !== 1) node.start = start;
        }
        while (i < lines.length) {
          const next = lines[i].trim().match(list);
          if (!next || /^\d/.test(next[1]) !== ordered) break;
          node.append(inline('li', next[2]));
          i++;
        }
        content.append(node);
      } else if (tableAt(i)) {
        const headers = cells(line);
        const container = el('div', 'md-table');
        const table = el('table');
        const head = el('thead');
        const titles = el('tr');
        headers.forEach(text => titles.append(inline('th', text)));
        head.append(titles);
        const body = el('tbody');
        i += 2;
        while (i < lines.length && lines[i].trim().includes('|')) {
          const columns = cells(lines[i++].trim());
          const row = el('tr');
          headers.forEach((_, index) => row.append(inline('td', columns[index] ?? '')));
          body.append(row);
        }
        table.append(head, body);
        container.append(table);
        content.append(container);
      } else {
        const paragraph = [line];
        i++;
        while (i < lines.length) {
          const next = lines[i].trim();
          if (!next || heading.test(next) || fence.test(next) || rule.test(next) || list.test(next)
              || next.startsWith('> ') || tableAt(i)) break;
          paragraph.push(next);
          i++;
        }
        content.append(inline('p', paragraph.join(' ')));
      }
    }
    return content;
  }

  async function request(path, body) {
    const headers = token ? { 'X-Sidecar-Token': token } : {};
    const conversationId = currentConversation();
    if (typeof conversationId === 'string' && /^(?!-)[0-9a-zA-Z_-]{1,128}$/.test(conversationId)) {
      headers['X-Agy-Conversation-Id'] = conversationId;
    }
    const options = { headers, redirect: 'error', cache: 'no-store' };
    if (body !== undefined) {
      headers['Content-Type'] = 'application/json';
      options.method = 'POST';
      options.body = JSON.stringify(body);
    }
    const response = await (window.sidecar?.fetch || fetch)(path, options);
    if (!response.ok) {
      const error = await response.json().catch(() => ({}));
      throw new Error(error.message || 'HTTP ' + response.status);
    }
    return response.json();
  }

  function feedback(message) {
    clearTimeout(lastFeedback);
    byId('feedback').textContent = message;
    lastFeedback = setTimeout(() => { byId('feedback').textContent = ''; }, 4500);
  }

  function update(next) {
    state = next;
    const fingerprint = JSON.stringify([currentConversation(), next.sampledAt, next.maxAutoReads, next.prefs, next.targets]);
    if (fingerprint === renderedSnapshot) return;
    renderedSnapshot = fingerprint;
    const confirmedTheme = normalizeTheme(next.prefs.theme);
    try { window.localStorage.setItem(themeCacheKey, confirmedTheme); } catch { /* cache is optional */ }
    applyTheme(pendingTheme ?? confirmedTheme);
    render();
  }

  async function setPrefs(value) {
    try { update(await request('/api/prefs', value)); return true; }
    catch (error) {
      feedback(!error.message || /^HTTP /.test(error.message) ? '设置未保存，请重试' : error.message);
      return false;
    }
  }

  async function refresh(reason) {
    try {
      const next = await request('/api/refresh?reason=' + reason, {});
      update(next);
      if (reason === 'manual') feedback(next.error ? '同步失败，请重试' : '同步完成');
    } catch { feedback('侧栏连接失败，请重试'); }
  }

  async function copyText(text, successMessage) {
    try { await navigator.clipboard.writeText(text); }
    catch {
      const input = el('textarea');
      input.value = text;
      input.setAttribute('readonly', '');
      document.body.append(input);
      try {
        input.select();
        if (!document.execCommand('copy')) return feedback('无法访问剪贴板');
      } catch {
        return feedback('无法访问剪贴板');
      } finally { input.remove(); }
    }
    feedback(successMessage);
  }

  function copyReference(row) {
    const text = JSON.stringify({ target: row.target, sessionId: row.sessionId, expectedWorkspace: row.workspacePath,
      ...(row.activeTurnId && { expectedTurnId: row.activeTurnId }) });
    return copyText(text, '已复制会话引用');
  }

  function continuationPrompt(row) {
    const fields = [['标题', row.title], ['工作区', row.workspacePath], ['当前轮次', row.activeTurnId]];
    const details = [];
    for (const [label, value] of fields) {
      const text = typeof value === 'string' ? value.replace(/[\x00-\x1f\x7f]/g, ' ').trim() : '';
      if (text) details.push(label + '：' + text);
    }
    return '请使用 ' + row.target + ' 会话 ' + row.sessionId
      + (details.length ? '（' + details.join('，') + '）' : '') + '：';
  }

  async function toggleSummary(row, key) {
    if (summaries.has(key)) { summaries.delete(key); render(); return; }
    const box = { pending: true };
    summaries.set(key, box);
    render();
    const params = new URLSearchParams({ target: row.target, sessionId: row.sessionId });
    try {
      const result = await request('/api/summary?' + params);
      Object.assign(box, result, { pending: false });
      update(await request('/api/state'));
      render();
    } catch {
      Object.assign(box, { pending: false, failed: true });
      render();
    }
  }

  function button(text, handler, pressed) {
    const node = el('button', null, text);
    node.type = 'button';
    if (pressed !== undefined) node.setAttribute('aria-pressed', String(pressed));
    node.addEventListener('click', handler);
    return node;
  }

  function autoReadControls(preference, change) {
    const enabled = preference.autoRead === true;
    const limit = preference.autoReadLimit ?? state.maxAutoReads;
    const rounds = (preference.autoReadCount ?? 0) + '/' + limit;
    const controls = el('span', 'auto-read-controls');
    const toggle = button(enabled ? '自动 ' + rounds : '自动读取', () => {
      const conversationId = window.sidecar?.conversationId ?? new URLSearchParams(location.search).get('conversationId') ?? '';
      const projectId = window.sidecar?.projectId ?? '';
      void change({ autoRead: !enabled, ...(!enabled && { conversationId, projectId }) });
    }, enabled);
    toggle.setAttribute('aria-label', enabled ? '自动读取 ' + rounds : '自动读取');
    if (preference.autoReadConversationId) toggle.title = '绑定对话 ' + preference.autoReadConversationId.slice(0, 8);
    controls.append(toggle);
    if (enabled) {
      const input = el('input', 'auto-read-limit');
      Object.assign(input, { type: 'number', min: '1', max: '20', step: '1', value: String(limit), title: '跟进轮数上限（1–20）' });
      input.setAttribute('aria-label', '跟进轮数上限');
      input.addEventListener('change', async () => {
        if (!await change({ autoReadLimit: Number(input.value) })) input.value = String(limit);
      });
      controls.append(input);
    }
    return controls;
  }

  function card(row, reachable, preferences, isMonitored = true) {
    const key = row.target + ':' + row.sessionId;
    const pref = preferences[key] || {};
    const code = cardState(row, reachable, isMonitored);
    const current = Boolean(pref.pairedConversationId && pref.pairedConversationId === currentConversation());
    const node = el('article', 'card' + (code === 'waiting_approval' ? ' attention' : '') + (current ? ' current-pair' : ''));
    const head = el('div', 'card-head');
    const heading = el('div', 'card-heading');
    const dot = el('span', 'status-dot ' + code);
    dot.setAttribute('aria-hidden', 'true');
    const title = el('h3', '', row.title || row.sessionId);
    title.title = title.textContent;
    heading.append(dot, title);
    const badge = el('span', 'badge ' + code, (labels[code] || labels.unknown) + (hasNewReply(row, code) ? ' · 新回复' : ''));
    head.append(heading, badge);
    node.append(head);
    const meta = el('div', 'card-meta');
    if (pref.pairedConversationId) {
      const label = pref.pairLabel || pref.pairedConversationTitle || pref.pairedConversationId.slice(0, 8);
      const chip = el('span', 'pair-badge' + (current ? ' current' : ''), (current ? '当前对话' : '其他对话') + ' · ' + label);
      chip.title = pref.pairedConversationTitle || label;
      meta.append(chip);
    }
    if (row.workspacePath) {
      const workspace = el('p', 'workspace', row.workspacePath);
      workspace.title = row.workspacePath;
      meta.append(workspace);
    }
    if (pref.pairedConversationId || row.workspacePath) node.append(meta);
    const options = el('div', 'actions');
    const primary = el('div', 'actions-main');
    const secondary = el('div', 'actions-end');
    const change = values => setPrefs({ target: row.target, sessionId: row.sessionId, ...values });
    const copy = button('复制引用', () => copyReference(row));
    copy.title = '左键复制引用 JSON；右键复制可续写提示词';
    copy.addEventListener('contextmenu', event => {
      event.preventDefault();
      return copyText(continuationPrompt(row), '已复制可续写提示词，粘贴到对话框即可补充需求');
    });
    primary.append(button(summaries.has(key) ? '收起内容' : '读取会话', () => toggleSummary(row, key), summaries.has(key)),
      copy, autoReadControls(pref, change));
    const star = button(pref.starred ? '★' : '☆', () => change({ starred: !pref.starred }), !!pref.starred);
    star.className = 'icon-button star-button';
    star.title = pref.starred ? '取消星标' : '星标';
    star.setAttribute('aria-label', star.title);
    const panel = pairControls(pref, current, change);
    panel.id = 'card-more-' + encodeURIComponent(key);
    const drawerKey = 'more:' + key;
    panel.hidden = !drawers.has(drawerKey);
    const more = button('···', () => {
      const open = panel.hidden;
      panel.hidden = !open;
      more.setAttribute('aria-expanded', String(open));
      if (open) drawers.add(drawerKey);
      else drawers.delete(drawerKey);
    });
    more.className = 'icon-button';
    more.title = '更多操作';
    more.setAttribute('aria-label', '更多操作');
    more.setAttribute('aria-expanded', String(!panel.hidden));
    more.setAttribute('aria-controls', panel.id);
    secondary.append(star, more);
    options.append(primary, secondary);
    node.append(options, panel);
    if (pref.autoReadError) node.append(el('p', 'auto-read-error', pref.autoReadError));
    if (summaries.has(key)) {
      const result = summaries.get(key);
      const detail = el('div', 'summary');
      if (result.pending || result.failed || !result.messages?.length) {
        detail.append(el('p', 'muted', result.pending ? '读取中…' : result.failed ? '读取失败，收起后可重试' : '本轮暂无公开问答'));
      } else {
        for (const message of result.messages) {
          detail.append(el('strong', 'summary-role', message.role === 'user' ? '用户' : '会话回复'), renderMarkdown(message.text));
        }
        if (result.truncated) detail.append(el('p', 'muted', '部分内容已截取'));
      }
      node.append(detail);
    }
    return node;
  }

  function pairControls(pref, current, change) {
    const panel = el('div', 'more-panel');
    const form = el('form', 'pair-label');
    const input = el('input');
    Object.assign(input, { value: pref.pairLabel || '', maxLength: 32, placeholder: '自定义短标签' });
    input.setAttribute('aria-label', '配对短标签');
    const saveLabel = el('button', '', '保存标签');
    saveLabel.type = 'submit';
    form.append(input, saveLabel);
    form.addEventListener('submit', event => { event.preventDefault(); void change({ pairLabel: input.value }); });
    const actions = el('div', 'pair-actions');
    const bind = button(current ? '取消绑定' : '绑定当前对话', () => {
      const conversationId = currentConversation();
      if (!current && !conversationId) return feedback('请先打开要绑定的 Antigravity 对话');
      void change({ pairCurrent: !current, ...(!current && { conversationId }) });
    });
    actions.append(bind);
    if (pref.pairedConversationId && !current) {
      actions.append(button('取消绑定', () => change({ pairCurrent: false })));
    }
    actions.append(button(pref.hidden ? '恢复显示' : '隐藏', () => change({ hidden: !pref.hidden })));
    panel.append(form, actions);
    return panel;
  }

  function groupSessions(info, pref, query = '', currentId = '', onlyCurrent = false) {
    const monitored = new Map(info.sessions.map(row => [row.sessionId, row]));
    const rows = mergedSessions(info, monitored);
    const isCurrent = row => Boolean(currentId && pref(row).pairedConversationId === currentId);
    const rank = row => (isCurrent(row) ? 16 : 0) + (row.state === 'waiting_approval' ? 8 : 0) + (row.state === 'active' ? 4 : 0)
      + (hasNewReply(row, cardState(row, info.reachable !== false, monitored.has(row.sessionId))) ? 2 : 0)
      + (pref(row).starred || pref(row).autoRead ? 1 : 0);
    const sorted = [...rows.values()].sort((a, b) => rank(b) - rank(a)
      || (Date.parse(b.updatedAt) || 0) - (Date.parse(a.updatedAt) || 0));
    const filtering = Boolean(String(query || '').trim());
    const eligible = onlyCurrent ? sorted.filter(row => isCurrent(row) && !pref(row).hidden) : sorted;
    const filtered = filtering ? eligible.filter(row => matchesQuery(row, query)) : eligible;
    const visible = [];
    const recent = [];
    const hidden = [];
    for (const row of filtered) {
      if (pref(row).hidden) hidden.push(row);
      else if (filtering || rank(row) || monitored.has(row.sessionId)) visible.push(row);
      else recent.push(row);
    }
    return {
      total: eligible.length, matched: filtered.length, monitored,
      visible, recent: recent.slice(0, 20), recentCount: recent.length, hidden
    };
  }

  function mergedSessions(info, monitored = new Map(info.sessions.map(row => [row.sessionId, row]))) {
    const rows = new Map(monitored);
    for (const row of info.catalog?.sessions ?? []) {
      if (!rows.has(row.sessionId)) rows.set(row.sessionId, row);
    }
    return rows;
  }

  function conversationScope(snapshot, currentId, overrides) {
    let pairedVisibleCount = 0;
    let outsideApprovalCount = 0;
    for (const target of targets) {
      const info = snapshot.targets[target];
      if (!info) continue;
      for (const row of mergedSessions(info).values()) {
        const pref = snapshot.prefs.sessions[target + ':' + row.sessionId];
        if (pref?.hidden) continue;
        if (currentId && pref?.pairedConversationId === currentId) pairedVisibleCount++;
        else if (row.state === 'waiting_approval') outsideApprovalCount++;
      }
    }
    const effectiveOnlyCurrent = Boolean(currentId && (overrides.has(currentId)
      ? overrides.get(currentId) : pairedVisibleCount > 0));
    return { pairedVisibleCount, outsideApprovalCount, effectiveOnlyCurrent };
  }

  function cardState(row, reachable, isMonitored) {
    if (!reachable) return 'offline';
    if (['active', 'waiting_approval'].includes(row.state)) return row.state;
    if (!isMonitored && !row.outcome && row.state === 'unknown') return 'unloaded';
    return row.outcome || row.state;
  }

  function hasNewReply(row, code) {
    return ['completed', 'failed', 'interrupted'].includes(code) && row.unread && row.unread.kind !== 'waiting_approval';
  }

  function matchesQuery(row, query) {
    const terms = String(query || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return true;
    const haystack = [row.title, row.workspacePath, row.sessionId].filter(Boolean).join(' ').toLowerCase();
    return terms.every(term => {
      if (haystack.includes(term)) return true;
      let index = 0;
      for (const ch of haystack) {
        if (ch === term[index] && ++index === term.length) return true;
      }
      return false;
    });
  }

  function sessionDrawer(key, label, rows, reachable, preferences, monitored) {
    const drawer = el('details', 'session-drawer');
    drawer.open = drawers.has(key);
    drawer.addEventListener('toggle', () => { if (drawer.open) drawers.add(key); else drawers.delete(key); });
    drawer.append(el('summary', '', label));
    rows.forEach(row => drawer.append(card(row, reachable, preferences, monitored ? monitored.has(row.sessionId) : true)));
    return drawer;
  }

  function render() {
    if (!state) return;
    const { prefs } = state;
    byId('pause').textContent = prefs.paused ? '恢复心跳' : '暂停心跳';
    byId('pause').setAttribute('aria-pressed', String(prefs.paused));
    byId('notifications').setAttribute('aria-pressed', String(prefs.notifications));
    const syncStatus = byId('sync-status');
    const synced = byId('synced');
    syncStatus.classList.toggle('is-paused', prefs.paused);
    syncStatus.classList.toggle('is-pending', !state.sampledAt);
    synced.textContent = state.sampledAt ? new Date(state.sampledAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '待同步';
    syncStatus.title = (prefs.paused ? '心跳已暂停 · ' : '') + (state.sampledAt ? '同步于 ' + synced.textContent : '等待首次同步');
    const quota = byId('usage');
    quota.replaceChildren();
    const limits = state.targets['101-codex']?.rateLimits || state.targets['win-codex']?.rateLimits;
    for (const period of ['5h', '7d']) {
      const value = limits?.windows?.[period]?.remainingPercent;
      const remaining = Number.isFinite(value) ? Math.round(Math.max(0, Math.min(100, value))) : null;
      const item = el('div', 'quota-pill');
      const values = el('div', 'quota-values');
      values.append(el('span', '', period), el('strong', '', remaining === null ? '—' : remaining + '%'));
      const track = el('div', 'quota-track');
      track.setAttribute('aria-hidden', 'true');
      const fill = el('span', 'quota-fill');
      fill.style.setProperty('--fill', (remaining ?? 0) + '%');
      track.append(fill);
      item.append(values, track);
      quota.append(item);
    }
    const root = byId('targets');
    root.replaceChildren();
    const currentId = currentConversation();
    const { pairedVisibleCount, outsideApprovalCount, effectiveOnlyCurrent } = conversationScope(state, currentId, scopeOverrides);
    const scopeButton = byId('current-only');
    scopeButton.textContent = effectiveOnlyCurrent ? '仅当前 (' + pairedVisibleCount + ')' : '仅看当前对话';
    scopeButton.setAttribute('aria-pressed', String(effectiveOnlyCurrent));
    const reminder = byId('outside-approvals');
    reminder.hidden = !(effectiveOnlyCurrent && outsideApprovalCount);
    reminder.textContent = reminder.hidden ? '' : '其他对话有 ' + outsideApprovalCount + ' 个待审批 · 查看全部';
    const groups = targets.flatMap(target => {
      const info = state.targets[target];
      if (!info) return [];
      const pref = row => prefs.sessions[target + ':' + row.sessionId] || {};
      const grouped = groupSessions(info, pref, searchQuery, currentId, effectiveOnlyCurrent);
      if (effectiveOnlyCurrent && !grouped.total) return [];
      return [{ target, info, grouped, current: grouped.visible.some(row => currentId && pref(row).pairedConversationId === currentId) }];
    }).sort((a, b) => Number(b.current) - Number(a.current));
    const filtering = Boolean(searchQuery.trim() || effectiveOnlyCurrent);
    if (filtering && !groups.some(group => group.grouped.matched > 0)) {
      const empty = el('div', 'empty-scope');
      empty.append(el('p', 'muted', effectiveOnlyCurrent ? '当前对话暂无匹配会话' : '未找到匹配会话'),
        button('显示全部会话', showAllSessions));
      root.append(empty);
      return;
    }
    for (const { target, info, grouped } of groups) {
      const { total, matched, monitored, visible, recent, recentCount, hidden } = grouped;
      const group = el('section', 'group');
      const heading = el('div', 'group-head');
      const countText = !info.reachable ? (info.sampledAt ? '离线' : '待同步')
        : filtering ? '匹配 ' + matched + ' / ' + total : total + ' 个会话';
      heading.append(el('h2', '', target), el('span', 'count', countText));
      group.append(heading);
      visible.forEach(row => group.append(card(row, info.reachable, prefs.sessions, monitored.has(row.sessionId))));
      if (!total) group.append(el('p', 'empty', info.error?.message || '暂无会话'));
      else if (filtering && !matched) group.append(el('p', 'empty', '未找到匹配会话'));
      if (recent.length) {
        const count = recent.length === recentCount ? recent.length : recent.length + ' / ' + recentCount;
        group.append(sessionDrawer(target + ':recent', '近期空闲会话 · ' + count, recent, info.reachable, prefs.sessions, monitored));
      }
      if (hidden.length) {
        group.append(sessionDrawer(target + ':hidden', '已隐藏 · ' + hidden.length, hidden, info.reachable, prefs.sessions, monitored));
      }
      root.append(group);
    }
  }

  async function readState() {
    try { update(await request('/api/state')); }
    catch { if (!state) feedback('等待插件侧栏服务连接'); }
  }
  const onFocus = () => {
    if (state) update(state);
    if (document.visibilityState !== 'visible' || focusInFlight) return;
    focusInFlight = refresh('focus').finally(() => { focusInFlight = undefined; });
  };
  byId('refresh').onclick = async () => {
    byId('refresh').disabled = true;
    try { await refresh('manual'); } finally { byId('refresh').disabled = false; }
  };
  byId('pause').onclick = () => state && setPrefs({ paused: !state.prefs.paused });
  byId('notifications').onclick = () => state && setPrefs({ notifications: !state.prefs.notifications });
  const themeToggle = byId('theme-toggle');
  applyTheme(document.documentElement.dataset.theme);
  systemTheme?.addEventListener?.('change', () => { if (theme === 'auto') applyTheme(theme); });
  themeToggle.onclick = async () => {
    if (pendingTheme) return;
    const previousTheme = theme;
    const selected = nextTheme(theme);
    pendingTheme = selected;
    themeToggle.disabled = true;
    applyTheme(selected);
    const saved = await setPrefs({ theme: selected });
    pendingTheme = undefined;
    applyTheme(state?.prefs?.theme ?? (saved ? selected : previousTheme));
    themeToggle.disabled = false;
  };
  byId('current-only').onclick = () => {
    const currentId = currentConversation();
    if (!currentId) return feedback('请先打开要筛选的 Antigravity 对话');
    if (!state) return;
    const { effectiveOnlyCurrent } = conversationScope(state, currentId, scopeOverrides);
    scopeOverrides.set(currentId, !effectiveOnlyCurrent);
    render();
  };
  byId('outside-approvals').onclick = showAllSessions;
  const searchInput = byId('search');
  const clearSearch = byId('clear-search');
  const applySearch = value => {
    searchQuery = value;
    clearSearch.hidden = !searchQuery;
    render();
  };
  function showAllSessions() {
    const currentId = currentConversation();
    if (currentId) scopeOverrides.set(currentId, false);
    searchInput.value = '';
    applySearch('');
  }
  searchInput.addEventListener('input', () => applySearch(searchInput.value));
  clearSearch.addEventListener('click', () => {
    searchInput.value = '';
    applySearch('');
    searchInput.focus();
  });
  document.addEventListener('visibilitychange', onFocus);
  window.addEventListener('focus', onFocus);
  setInterval(() => { if (document.visibilityState === 'visible') void readState(); }, 5000);
  void readState();
</script>
</body>
</html>
